# The demo serves itself on 8081 and its actor ids use the same origin. DemoFlowIT starts the packaged app there too,
# so port 8081 must be free while it runs.
quarkus.http.port=8081
quarkus.http.test-port=8081
quarkus.activitypub.base-url=http://localhost:8081
quarkus.activitypub.delivery.poll-interval=1s

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# DemoFlowIT runs the packaged app with the test profile, for the loopback settings below
quarkus.test.integration-test-profile=test

# Loopback fediverse in dev and tests only: plain http and private addresses (127.0.0.1) allowed
%dev.quarkus.safe-fetch.https-only=false
%dev.quarkus.safe-fetch.allow-private-addresses=true
%test.quarkus.safe-fetch.https-only=false
%test.quarkus.safe-fetch.allow-private-addresses=true
